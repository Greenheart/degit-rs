[package]
name = "degit-rs"
version = "0.3.0"
authors = [
    "Vlad Pănăzan <brgdvz@gmail.com>",
    "Zach Fedor <zachfedor@gmail.com>",
    "Samuel Plumppu <6125097+Greenheart@users.noreply.github.com>",
]
edition = "2024"
description = "Rust rewrite of degit"
license = "MIT"
readme = "README.md"
repository = "https://github.com/zachfedor/degit-rs"

[[bin]]
name = "degit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "rustls",
] }
indicatif = "0.18.6"
flate2 = "1.1.9"
tar = "0.4.46"
colored = "3.1.1"
